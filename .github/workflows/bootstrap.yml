name: Verify bootstrap scripts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check POSIX shell syntax
        run: |
          for script in bootstrap/*.sh tests/*.sh; do
            sh -n "$script"
          done

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          # Existing CDPATH= cd usage and literal shell snippets are intentional.
          shellcheck --external-sources --source-path=bootstrap -s sh -e SC1007,SC2016 bootstrap/*.sh tests/*.sh

      - name: Smoke-test help without installing software
        run: |
          for script in bootstrap/bootstrap.sh bootstrap/1password.sh \
            bootstrap/cli-tools.sh bootstrap/coding-agents.sh bootstrap/containers.sh \
            bootstrap/fonts.sh bootstrap/gui-editors.sh bootstrap/java.sh \
            bootstrap/javascript.sh bootstrap/link-dotfiles.sh \
            bootstrap/terminal-tools.sh bootstrap/verify.sh; do
            "$script" --help >/dev/null
          done

      - name: Test Fedora routing without system changes
        run: sh tests/fedora-bootstrap.sh

  fedora:
    name: Fedora package and routing checks
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y git tar gzip jq python3 unzip libstdc++

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect Fedora
        run: |
          BOOTSTRAP_DIR="$PWD/bootstrap"
          . "$BOOTSTRAP_DIR/lib.sh"
          detect_platform
          test "$PLATFORM" = fedora

      - name: Check Fedora package names
        run: |
          packages='git git-lfs gh glab curl ca-certificates zsh util-linux tmux fzf fd-find zoxide ripgrep wl-clipboard gcc gcc-c++ make unzip btop htop tig mc jq tree wget file ffmpeg-free 7zip poppler-utils ImageMagick java-25-openjdk-devel maven neovim kitty adobe-source-code-pro-fonts cascadia-code-fonts fira-code-fonts fontconfig jetbrains-mono-fonts source-foundry-hack-fonts gnupg2 moby-engine docker-compose docker-buildx podman podman-compose'
          # The package list is fixed in this workflow.
          dnf repoquery --available --queryformat '%{name}' $packages > /tmp/fedora-packages
          for package in $packages; do
            grep -Fxq "$package" /tmp/fedora-packages || { echo "Missing Fedora package: $package" >&2; exit 1; }
          done

      - name: Test Fedora routing and verified Yazi download
        run: |
          sh tests/fedora-bootstrap.sh
          sh tests/fedora-yazi.sh

      - name: Check syntax and help in Fedora userspace
        run: |
          for script in bootstrap/*.sh tests/*.sh; do
            sh -n "$script"
          done
          for script in bootstrap/bootstrap.sh bootstrap/1password.sh \
            bootstrap/cli-tools.sh bootstrap/coding-agents.sh bootstrap/containers.sh \
            bootstrap/fonts.sh bootstrap/gui-editors.sh bootstrap/java.sh \
            bootstrap/javascript.sh bootstrap/link-dotfiles.sh \
            bootstrap/terminal-tools.sh bootstrap/verify.sh; do
            "$script" --help >/dev/null
          done
