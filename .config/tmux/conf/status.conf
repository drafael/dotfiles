# Catppuccin status line and tmux interface styling.

# Start at the top while preserving runtime position changes across reloads.
set -ogq @status_state "top"
if-shell -F '#{==:#{@status_state},hidden}' \
  'set-option -g status off' \
  'set-option -g status on; set-option -gF status-position "#{@status_state}"'

# Refresh path and activity information without running expensive status jobs.
set -g status-interval 2

# Center the window list between the session block and right-side metadata.
set -g status-justify centre

# Leave enough room for descriptive session names and home-relative paths.
set -g status-left-length 40
set -g status-right-length 100

# Paint the otherwise empty status row with the active Catppuccin base color.
set -gF status-style "fg=#{@thm_fg},bg=#{@thm_bg}"

# Use a flat blue block for the session; pressing the prefix changes it to red
# as a subtle visual indication that tmux is waiting for a command.
set -g status-left '#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_blue}},bold] #S #[default]'

# Keep inactive windows quiet and separate flat blocks with one base-color cell.
set -gF window-status-style "fg=#{@thm_subtext_0},bg=#{@thm_surface_0}"
set -g window-status-format ' #I:#W#{?window_zoomed_flag, Z,} '
set -g window-status-separator '#[fg=#{@thm_fg},bg=#{@thm_bg}] '

# Match Neovim's active Lualine block with blue, bold, dark-on-light text.
set -gF window-status-current-style "fg=#{@thm_crust},bg=#{@thm_blue},bold"
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '

# Use semantic colors for background activity and terminal bell indicators.
set -gF window-status-activity-style "fg=#{@thm_crust},bg=#{@thm_green},bold"
set -gF window-status-bell-style "fg=#{@thm_crust},bg=#{@thm_red},bold"

# Show server identity plus the active pane's home-relative path.  Preserve the
# rightmost path components when space is tight and mark truncation with an
# ellipsis so user@host remains readable.
set -g status-right '#[fg=#{@thm_blue},bg=#{@thm_surface_0},bold] #{USER}@#h:#[nobold]#{=/-60/…:#{s|#{HOME}|~|:pane_current_path}} '

# Distinguish the active pane without introducing heavy pane decorations.
set -wgF pane-border-style "fg=#{@thm_surface_0}"
set -wgF pane-active-border-style "fg=#{@thm_blue}"

# Highlight copy-mode selections and command choices with the active blue.
set -wgF mode-style "fg=#{@thm_crust},bg=#{@thm_blue},bold"

# Theme informational messages and the command prompt consistently.
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_surface_0},align=centre"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},align=centre"

# Apply the palette to fzf and other tmux popups.
set -wgF popup-style "fg=#{@thm_fg},bg=#{@thm_bg}"
set -wgF popup-border-style "fg=#{@thm_blue},bg=#{@thm_bg}"
set -wg popup-border-lines rounded

# tmux 3.4 introduced independently styled menus; tmux 3.3 safely skips them.
%if "#{!:#{m/r:^3[.]3,#{version}}}"
set -gF menu-style "fg=#{@thm_fg},bg=#{@thm_bg}"
set -gF menu-selected-style "fg=#{@thm_crust},bg=#{@thm_blue},bold"
set -gF menu-border-style "fg=#{@thm_blue},bg=#{@thm_bg}"
%endif

# Reuse the main accent when tmux's built-in clock is displayed.
set -wgF clock-mode-colour "#{@thm_blue}"
