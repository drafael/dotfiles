# Prefix and key bindings.

# Replace tmux's default Ctrl-b prefix with the existing Ctrl-Space workflow.
unbind-key C-b
set -g prefix C-Space

# Pressing the prefix twice sends it through to a nested tmux session.
bind-key C-Space send-prefix

# Reload every module and briefly confirm success.
bind-key r source-file -F '#{@config_dir}/tmux.conf' \; display-message 'tmux configuration reloaded'

# Create horizontal and vertical splits in the active pane's directory.
unbind-key '"'
unbind-key '%'
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'

# Create new windows in the active pane's directory rather than server startup cwd.
bind-key c new-window -c '#{pane_current_path}'

# Close the active pane with confirmation, or immediately with q.  Killing the
# only pane in a window also closes that window.
bind-key x confirm-before -p 'close pane #P? (y/n)' kill-pane
bind-key q kill-pane

# Resize tmux panes repeatedly after a single prefix press.  These remain a
# fallback when a terminal cannot distinguish Ctrl-Shift navigation keys.
bind-key -r H resize-pane -L 3
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 3

# Let Neovim or fzf consume navigation keys while active; otherwise navigate
# tmux panes directly.  Neovim hands a key back to tmux at an editor boundary.
bind-key -n C-h if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-l' 'select-pane -R'

# Apply the same ownership rule to the distinct Ctrl-Shift resize keys.
bind-key -n C-S-h if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-S-h' 'resize-pane -L 3'
bind-key -n C-S-j if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-S-j' 'resize-pane -D 2'
bind-key -n C-S-k if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-S-k' 'resize-pane -U 2'
bind-key -n C-S-l if-shell '"#{@config_dir}/scripts/pane-is-editor" "#{pane_tty}"' 'send-keys C-S-l' 'resize-pane -R 3'

# Cycle bottom, top, and hidden status states without changing the theme.
bind-key S run-shell -b '"#{@config_dir}/scripts/cycle-status"'

# Toggle the entire tmux server between Catppuccin Frappé and Latte.
bind-key T run-shell -b '"#{@config_dir}/scripts/toggle-theme"'

# Open focused fzf popups for tmux targets and project-backed sessions.
bind-key f display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' tmux switcher ' "exec '$HOME/.config/tmux/scripts/fzf-switch'"
bind-key p display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' project launcher ' "exec '$HOME/.config/tmux/scripts/fzf-project'"

# Use Vim-like copy-mode selection and always copy through the portable helper.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"#{@config_dir}/scripts/clipboard-copy"'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"#{@config_dir}/scripts/clipboard-copy"'
