# General behavior and terminal capabilities.

# Advertise tmux's own modern terminfo entry to applications inside panes.
set -g default-terminal "tmux-256color"

# Ghostty and Kitty support these capabilities even on systems whose terminfo
# database does not yet describe every feature.  tmux 3.3 predates the named
# hyperlinks feature, so keep its declaration version-safe.
%if "#{m/r:^3[.]3,#{version}}"
set -s terminal-features[100] "xterm-ghostty:RGB,clipboard,cstyle,extkeys,focus,mouse,overline,strikethrough,sync,title,usstyle"
set -s terminal-features[101] "xterm-kitty:RGB,clipboard,cstyle,extkeys,focus,mouse,overline,strikethrough,sync,title,usstyle"
%else
set -s terminal-features[100] "xterm-ghostty:RGB,clipboard,cstyle,extkeys,focus,hyperlinks,mouse,overline,strikethrough,sync,title,usstyle"
set -s terminal-features[101] "xterm-kitty:RGB,clipboard,cstyle,extkeys,focus,hyperlinks,mouse,overline,strikethrough,sync,title,usstyle"
%endif

# Ask capable terminals for modified-key sequences so Ctrl-Shift navigation is
# distinguishable from its unshifted counterpart.
set -s extended-keys on

# tmux 3.5 added CSI-u output.  Earlier supported versions retain their native
# xterm-style extended-key encoding, which Neovim also understands.
%if "#{!:#{m/r:^3[.](3|4),#{version}}}"
set -s extended-keys-format csi-u
%endif

# Forward focus changes to Neovim and other focus-aware terminal applications.
set -g focus-events on

# Let tmux both accept and emit OSC 52 clipboard sequences when supported.
set -g set-clipboard on

# Permit visible panes to send wrapped escape sequences directly to the outer
# terminal for graphics protocols.  Only run trusted programs in these panes.
set -wg allow-passthrough on

# Enable pane selection, resizing, scrolling, and copy-mode entry with a mouse.
set -g mouse on

# Number windows and panes from one to match keyboard window-selection keys.
set -g base-index 1
set -wg pane-base-index 1

# Close numbering gaps after windows are removed.
set -g renumber-windows on

# Keep enough pane history for long builds and logs without terminal plugins.
set -g history-limit 100000

# Remove tmux's historical escape-key delay while retaining a small margin for
# terminals that encode Alt combinations as an Escape-prefixed sequence.
set -s escape-time 10

# Allow comfortable repeated pane movement and resizing after one prefix press.
set -g repeat-time 600

# Use familiar Vim keys in both copy mode and tmux command prompts.
set -wg mode-keys vi
set -g status-keys vi

# Accept application-set pane titles as an agent-detection signal, but prevent
# applications from directly replacing tmux window names. Normalize known
# coding agents and retain the active command for every other window.
set -wg allow-set-title on
set -wg automatic-rename on
set -wg automatic-rename-format '#{?#{m/r:^π,#{pane_title}},pi,#{?#{m/r:^pi$,#{pane_current_command}},pi,#{?#{m/r:^opencode(\.exe)?$,#{pane_current_command}},opencode,#{?#{m/r:^(OpenCode|OC ),#{pane_title}},opencode,#{?#{m/r:Claude Code,#{pane_title}},claude code,#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},claude code,#{b:pane_current_command}}}}}}}'
set -wg allow-rename off

# Reflect the active tmux session and window in the outer terminal title.
set -g set-titles on
set -g set-titles-string '#S:#I:#W'

# Mark background activity in the window list without showing visual alerts.
set -wg monitor-activity on
set -g visual-activity off
set -g visual-bell off

# Keep confirmations visible long enough to read without lingering.
set -g display-time 1500

# Switch to the most recently active remaining session instead of detaching
# when the current session is destroyed (portable to the tmux 3.3 baseline).
set -g detach-on-destroy off

# Import the project-root override whenever a client attaches to the server.
# A stable array index makes repeated configuration reloads idempotent.
set -g update-environment[100] "TMUX_PROJECT_DIRS"
