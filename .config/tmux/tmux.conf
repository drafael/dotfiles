# ~/.config/tmux/tmux.conf
#
# Plugin-free tmux configuration for tmux 3.3 and newer.  This file is the
# entry point; focused modules below keep options, styling, and bindings easy
# to audit without hiding behavior behind a plugin manager.

# Keep the install location in one tmux option so sourced files and bindings
# work whether this repository is cloned directly or reached through a symlink.
set -g @config_dir "$HOME/.config/tmux"

# Load terminal capabilities and general interaction defaults first.
source-file -F "#{@config_dir}/conf/options.conf"

# Frappé is the initial flavor.  -o preserves a runtime Latte selection when
# this file is reloaded in an existing server.
set -ogq @theme "frappe"

# Load the selected official Catppuccin palette; unknown values safely render
# as Frappé until the theme toggle writes a valid value.
if-shell -F '#{==:#{@theme},latte}' \
  'source-file -F "#{@config_dir}/themes/latte.conf"' \
  'source-file -F "#{@config_dir}/themes/frappe.conf"'

# Apply palette-aware status, pane, popup, message, and copy-mode styles.
source-file -F "#{@config_dir}/conf/status.conf"

# Bind keys last so every command can rely on the options and colors above.
source-file -F "#{@config_dir}/conf/keys.conf"
