# ~/.config/kitty/kitty.conf
# 1:1 port of ~/.dotfiles/.config/ghostty/config (Catppuccin Frappé, pinned dark)

# ===== Font =====
font_family      Monaco
font_size        14.0

# ===== Window =====
initial_window_width  208c
initial_window_height 50c
window_padding_width  4
remember_window_size  yes

# Integrated title bar (ghostty "transparent" look): keep the native titlebar
# band + traffic lights in their normal position, but tint the bar with the
# background color so it blends seamlessly into the terminal.
hide_window_decorations    no
macos_titlebar_color       background
macos_show_window_title_in menubar

# ===== Transparency =====
background_opacity 0.96
background_blur    8

# ===== macOS =====
macos_traditional_fullscreen no
macos_option_as_alt          yes

# ===== Cursor =====
cursor_shape          block
cursor_blink_interval 0

# ===== Clipboard =====
copy_on_select    clipboard
clipboard_control write-clipboard read-clipboard write-primary read-primary

# ===== Shell integration =====
shell_integration enabled no-cursor

# ===== Tabs =====
# kitty draws its own tab bar (no macOS-native tabs); styled with the same
# Catppuccin Frappé statusline colors as Neovim, without rendering mode/branch
# text in the tab bar.
tab_bar_edge       top
# Keep the tab bar visually one terminal row tall, matching Neovim's
# statusline height. Any non-zero vertical margin makes it look taller.
tab_bar_margin_height 0.0 0.0
tab_bar_style      separator
tab_separator      ""
tab_bar_align      left
tab_bar_min_tabs   2
tab_bar_background #303446

tab_title_template        " {title} "
active_tab_title_template " {title} "

# Active tab uses the same blue block styling as the NORMAL mode segment in
# your Neovim statusline screenshots, but keeps only the tab title text.
active_tab_background   #8CAAEE
active_tab_foreground   #303446
active_tab_font_style   bold
# Inactive tabs use the grey branch-block styling from the Neovim statusline.
inactive_tab_background #414559
inactive_tab_foreground #8CAAEE
inactive_tab_font_style normal

# ===== Misc =====
# Keep Kitty's native xterm-kitty TERM value so tmux can detect its color,
# key, clipboard, and hyperlink capabilities.
scrollback_lines 100000

# ===== Catppuccin Frappé =====
foreground           #C6D0F5
background           #303446
selection_foreground #303446
selection_background #F2D5CF

cursor          #F2D5CF
cursor_text_color #303446
url_color       #F2D5CF

active_border_color   #BABBF1
inactive_border_color #737994

# The 16 terminal colors
color0  #51576D
color8  #626880
color1  #E78284
color9  #E78284
color2  #A6D189
color10 #A6D189
color3  #E5C890
color11 #E5C890
color4  #8CAAEE
color12 #8CAAEE
color5  #F4B8E4
color13 #F4B8E4
color6  #81C8BE
color14 #81C8BE
color7  #B5BFE2
color15 #A5ADCE

# ===== Keybinds =====
# shift+enter -> newline (ghostty: shift+enter=text:\n)
map shift+enter send_text all \n

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Close current split (kitty default cmd+w closes the whole tab). When it's the
# last split, close_window closes the window too — matches ghostty.
map cmd+w close_window

# Select tabs (ghostty-style cmd+number)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# ===== Splits =====
enabled_layouts splits:split_axis=horizontal

# create
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# resize (EXACT ghostty parity: cmd+ctrl+hjkl + arrows, 40 cols / 20 rows)
map cmd+ctrl+h     resize_window narrower 40
map cmd+ctrl+l     resize_window wider 40
map cmd+ctrl+k     resize_window taller 20
map cmd+ctrl+j     resize_window shorter 20
map cmd+ctrl+left  resize_window narrower 40
map cmd+ctrl+right resize_window wider 40
map cmd+ctrl+up    resize_window taller 20
map cmd+ctrl+down  resize_window shorter 20

# equalize
map cmd+ctrl+equal layout_action equalize

# navigate (ghostty default goto_split parity: cmd+alt+arrows)
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
